<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Einkaufsliste</title>
    <style>
        :root {
            --bg-color: #1e1e2e;
            --card-bg: #2b2b3d;
            --text-color: #e0e0e0;
            --accent-color: #74c7ec;
            --accent-hover: #89dceb;
            --danger-color: #f38ba8;
            --completed-color: #a6adc8;
            --border-color: #45475a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 480px;
        }

        h1 {
            margin: 0 0 25px 0;
            font-size: 1.8rem;
            text-align: center;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #181825;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        button {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-add {
            background-color: var(--accent-color);
            color: #11111b;
        }

        .btn-add:hover {
            background-color: var(--accent-hover);
        }

        .btn-clear {
            width: 100%;
            padding: 12px;
            background-color: transparent;
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-clear:hover {
            background-color: var(--danger-color);
            color: #11111b;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0 0 20px 0;
        }

        /* Versteckt den Freiraum der Liste komplett, wenn keine Einträge da sind */
        ul:empty {
            margin-bottom: 0;
        }

        li {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background-color: #181825;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s ease;
        }

        li:last-child {
            margin-bottom: 20px;
        }

        li:hover {
            background-color: #313244;
        }

        li.completed {
            text-decoration: line-through;
            color: var(--completed-color);
            opacity: 0.6;
        }

        .checkbox {
            margin-right: 14px;
            width: 18px;
            height: 18px;
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        .item-text {
            flex: 1;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🛒 Einkaufsliste</h1>
    
    <div class="input-group">
        <input type="text" id="itemInput" placeholder="Neuer Eintrag..." onkeydown="if(event.key === 'Enter') addItem()">
        <button class="btn-add" onclick="addItem()">Hinzufügen</button>
    </div>

    <ul id="shoppingList"></ul>

    <button class="btn-clear" onclick="clearCompleted()">🗑️ Erledigte löschen</button>
</div>

<script>
    // Startet mit leerer Liste (oder lädt gespeicherte Einträge aus dem Speicher)
    let items = JSON.parse(localStorage.getItem('shoppingList')) || [];

    function renderList() {
        const list = document.getElementById('shoppingList');
        list.innerHTML = '';

        items.forEach((item, index) => {
            const li = document.createElement('li');
            if (item.completed) li.classList.add('completed');

            li.innerHTML = `
                <input type="checkbox" class="checkbox" ${item.completed ? 'checked' : ''} onclick="toggleItem(${index}); event.stopPropagation();">
                <span class="item-text">${item.text}</span>
            `;

            li.onclick = () => toggleItem(index);
            list.appendChild(li);
        });

        saveItems();
    }

    function addItem() {
        const input = document.getElementById('itemInput');
        const text = input.value.trim();
        
        if (text !== '') {
            items.push({ text: text, completed: false });
            input.value = '';
            renderList();
        }
    }

    function toggleItem(index) {
        items[index].completed = !items[index].completed;
        renderList();
    }

    function clearCompleted() {
        items = items.filter(item => !item.completed);
        renderList();
    }

    function saveItems() {
        localStorage.setItem('shoppingList', JSON.stringify(items));
    }

    renderList();
</script>

</body>
</html>
